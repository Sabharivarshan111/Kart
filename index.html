<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so safe-area insets are available; user-scalable=no
         plus maximum-scale=1 kills Android's double-tap zoom, which otherwise
         eats the second tap of a quick drift-button double press. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Sparkdrift — a cel-shaded arcade kart racer." />
    <!-- An empty data URI, so the browser never requests a favicon at all.
         The zero-external-assets rule includes the ones the browser asks for
         on its own. -->
    <link rel="icon" href="data:," />
    <title>Sparkdrift</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
